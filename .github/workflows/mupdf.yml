name: MuPDF Release Build

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86
            platform: windows
            arch: x86
            runs_on: windows-latest
            vs_arch: x86
          - name: windows-x64
            platform: windows
            arch: x64
            runs_on: windows-latest
            vs_arch: amd64
          - name: windows-arm64
            platform: windows
            arch: arm64
            runs_on: windows-latest
            vs_arch: amd64_arm64
          - name: linux-x64
            platform: linux
            arch: x64
            runs_on: ubuntu-latest
          - name: linux-arm64
            platform: linux
            arch: arm64
            runs_on: ubuntu-22.04-arm
          - name: macos-x64
            platform: macos
            arch: x64
            runs_on: macos-13
          - name: macos-arm64
            platform: macos
            arch: arm64
            runs_on: macos-14

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone MuPDF source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/mupdf"
          git clone --depth 1 --branch 1.28.5 https://github.com/ArtifexSoftware/mupdf.git "$RUNNER_TEMP/mupdf"
          ls -la "$RUNNER_TEMP/mupdf"

      - name: Install Linux deps
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config zlib1g-dev libfreetype6-dev \
            libjpeg-dev libpng-dev
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      - name: Install macOS deps
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euxo pipefail
          xcode-select --install || true

      - name: Build MuPDF (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/mupdf"

          export CFLAGS="-O2 -fPIC"
          export LDFLAGS=""
          export CPPFLAGS=""

          if [ "${{ matrix.arch }}" = "arm64" ]; then
            export CC=aarch64-linux-gnu-gcc
            export CXX=aarch64-linux-gnu-g++
            export AR=aarch64-linux-gnu-ar
            export RANLIB=aarch64-linux-gnu-ranlib
            export STRIP=aarch64-linux-gnu-strip
            export CFLAGS="-O2 -fPIC -march=armv8-a"
          fi

          # MuPDF 官方构建通常是 make / make shared
          make -j"$(nproc)" HAVE_X11=no || true
          make -j"$(nproc)" shared HAVE_X11=no || true
          ls -la
          find . -maxdepth 3 \( -name "libmupdf*.a" -o -name "libmupdf*.so*" -o -name "mupdf*.dll" -o -name "mupdf*.dylib" \) | head -200

      - name: Build MuPDF (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/mupdf"

          ARCH="${{ matrix.arch }}"
          if [ "$ARCH" = "x64" ]; then
            ARCH_FLAG="x86_64"
          elif [ "$ARCH" = "arm64" ]; then
            ARCH_FLAG="arm64"
          else
            echo "Unsupported macOS arch: $ARCH"
            exit 1
          fi

          export CFLAGS="-O2 -fPIC -arch ${ARCH_FLAG}"
          export LDFLAGS="-arch ${ARCH_FLAG}"
          export CPPFLAGS="-I$PWD/include"

          make -j"$(sysctl -n hw.ncpu)" HAVE_X11=no || true
          make -j"$(sysctl -n hw.ncpu)" shared HAVE_X11=no || true

          find . -maxdepth 3 \( -name "libmupdf*.a" -o -name "libmupdf*.so*" -o -name "mupdf*.dll" -o -name "mupdf*.dylib" \) | head -200

      - name: Build MuPDF (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=${{ matrix.vs_arch }}
          cd /d "%RUNNER_TEMP%\\mupdf"

          rem 如果你实际使用的是 fork/自定义 muPDF 分支，需要替换下面的生成/编译入口
          rem MuPDF 官方 Windows 构建通常基于 nmake / Makefile.msvc
          nmake /f Makefile.msvc CFG=release || exit /b 1
          nmake /f Makefile.msvc CFG=release SHARED=1 || exit /b 1

          dir /s /b "%RUNNER_TEMP%\\mupdf" | findstr /I "mupdf.lib mupdf.dll libmupdf.a libmupdf*.a"

      - name: Package artifacts
        shell: bash
        run: |
          set -euxo pipefail

          SRC_DIR="$RUNNER_TEMP/mupdf"
          PKG_DIR="$RUNNER_TEMP/mupdf-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "$PKG_DIR/static" "$PKG_DIR/shared" "$PKG_DIR/include"

          # 复制 public headers
          if [ -d "$SRC_DIR/include" ]; then
            cp -R "$SRC_DIR/include/." "$PKG_DIR/include/"
          fi

          # 收集静态库
          find "$SRC_DIR" -type f \( -name "libmupdf*.a" -o -name "*.lib" \) -exec cp -f {} "$PKG_DIR/static/" \;

          # 收集动态库
          find "$SRC_DIR" -type f \( -name "libmupdf*.so*" -o -name "libmupdf*.dylib" -o -name "mupdf*.dll" \) -exec cp -f {} "$PKG_DIR/shared/" \;

          # Windows 下把 .dll/.lib 和静态库都放入对应目录
          if [ "${{ matrix.platform }}" = "windows" ]; then
            find "$SRC_DIR" -type f \( -name "mupdf*.dll" -o -name "mupdf*.lib" \) -exec cp -f {} "$PKG_DIR/shared/" \;
          fi

          # 目录结构检查
          echo "=== package tree ==="
          find "$PKG_DIR" -maxdepth 2 -print | sort

          if [ "${{ matrix.platform }}" = "windows" ]; then
            zip -qr "$GITHUB_WORKSPACE/mupdf-${{ matrix.platform }}-${{ matrix.arch }}.zip" "$PKG_DIR"
          else
            tar -czf "$GITHUB_WORKSPACE/mupdf-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C "$RUNNER_TEMP" "mupdf-${{ matrix.platform }}-${{ matrix.arch }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mupdf-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ github.workspace }}/mupdf-${{ matrix.platform }}-${{ matrix.arch }}.zip
            ${{ github.workspace }}/mupdf-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release files
        shell: bash
        run: |
          set -euxo pipefail
          find release-artifacts -type f | sort
          find release-artifacts -type f -name "*.zip" -o -name "*.tar.gz" | while read f; do
            echo "Found: $f"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.zip
            release-artifacts/**/*.tar.gz
