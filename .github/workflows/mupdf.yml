name: MuPDF Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86
            platform: windows
            arch: x86
            runs_on: windows-latest
            vs_arch: x86
          - name: windows-x64
            platform: windows
            arch: x64
            runs_on: windows-latest
            vs_arch: amd64
          - name: windows-arm64
            platform: windows
            arch: arm64
            runs_on: windows-latest
            vs_arch: amd64_arm64

          - name: linux-x64
            platform: linux
            arch: x64
            runs_on: ubuntu-latest
          - name: linux-arm64
            platform: linux
            arch: arm64
            runs_on: ubuntu-22.04-arm

          - name: macos-x64
            platform: macos
            arch: x64
            runs_on: macos-13
          - name: macos-arm64
            platform: macos
            arch: arm64
            runs_on: macos-14

    defaults:
      run:
        shell: bash

    steps:
      - name: Clone official MuPDF repo
        shell: bash
        run: |
          set -euxo pipefail

          # 你指定的官方仓库方式：
          # git clone git://git.ghostscript.com/mupdf.git
          #
          # 如果 git:// 在 GitHub Actions 运行器上被拦截，可以替换为：
          # git clone https://git.ghostscript.com/mupdf.git
          git clone --depth 1 git://git.ghostscript.com/mupdf.git "$RUNNER_TEMP/mupdf"

          cd "$RUNNER_TEMP/mupdf"
          git submodule update --init --depth 1
          git rev-parse --short HEAD

      - name: Install Linux deps
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            zlib1g-dev \
            libfreetype6-dev \
            libjpeg-dev \
            libpng-dev \
            libopenjp2-7-dev

          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
          fi

      - name: Build MuPDF for Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/mupdf"

          export CFLAGS="-O2 -fPIC"
          export LDFLAGS=""
          export CPPFLAGS=""

          if [ "${{ matrix.arch }}" = "arm64" ]; then
            export CC=aarch64-linux-gnu-gcc
            export CXX=aarch64-linux-gnu-g++
            export AR=aarch64-linux-gnu-ar
            export RANLIB=aarch64-linux-gnu-ranlib
            export STRIP=aarch64-linux-gnu-strip
            export CFLAGS="-O2 -fPIC -march=armv8-a"
          fi

          make -j"$(nproc)" HAVE_X11=no
          make -j"$(nproc)" shared HAVE_X11=no

          find . -maxdepth 3 \( -name "libmupdf*.a" -o -name "libmupdf*.so*" \) | sort

      - name: Build MuPDF for macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/mupdf"

          ARCH="${{ matrix.arch }}"
          if [ "$ARCH" = "x64" ]; then
            ARCH_FLAG="x86_64"
          elif [ "$ARCH" = "arm64" ]; then
            ARCH_FLAG="arm64"
          else
            echo "Unsupported macOS arch: $ARCH"
            exit 1
          fi

          export CFLAGS="-O2 -fPIC -arch ${ARCH_FLAG}"
          export CXXFLAGS="-O2 -fPIC -arch ${ARCH_FLAG}"
          export LDFLAGS="-arch ${ARCH_FLAG}"
          export CPPFLAGS="-I$PWD/include"

          make -j"$(sysctl -n hw.ncpu)" HAVE_X11=no
          make -j"$(sysctl -n hw.ncpu)" shared HAVE_X11=no

          find . -maxdepth 3 \( -name "libmupdf*.a" -o -name "libmupdf*.dylib" \) | sort

      - name: Build MuPDF for Windows
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=${{ matrix.vs_arch }}
          cd /d "%RUNNER_TEMP%\\mupdf"

          rem Official MuPDF Windows build usually uses nmake + Makefile.msvc
          nmake /f Makefile.msvc CFG=release
          nmake /f Makefile.msvc CFG=release SHARED=1

          dir /s /b "%RUNNER_TEMP%\\mupdf" | findstr /I "mupdf.lib mupdf.dll libmupdf"

      - name: Package official build into tar.gz
        shell: bash
        run: |
          set -euxo pipefail

          SRC_DIR="$RUNNER_TEMP/mupdf"
          PKG_DIR="$RUNNER_TEMP/mupdf-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "$PKG_DIR/include" "$PKG_DIR/static" "$PKG_DIR/shared"

          # include 头文件
          if [ -d "$SRC_DIR/include" ]; then
            cp -R "$SRC_DIR/include/." "$PKG_DIR/include/"
          fi

          # 静态库：.a / .lib
          find "$SRC_DIR" -type f \( -name "libmupdf*.a" -o -name "*.lib" \) -exec cp -f {} "$PKG_DIR/static/" \;

          # 动态库：.so / .dylib / .dll
          find "$SRC_DIR" -type f \( -name "libmupdf*.so*" -o -name "libmupdf*.dylib" -o -name "mupdf*.dll" \) -exec cp -f {} "$PKG_DIR/shared/" \;

          # 兼容 Windows 的 .dll/.lib 可能在 build 目录里
          if [ "${{ matrix.platform }}" = "windows" ]; then
            find "$SRC_DIR" -type f \( -name "mupdf*.dll" -o -name "mupdf*.lib" \) -exec cp -f {} "$PKG_DIR/shared/" \;
          fi

          echo "=== package contents ==="
          find "$PKG_DIR" -maxdepth 2 -print | sort

          tar -czf "$GITHUB_WORKSPACE/mupdf-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C "$RUNNER_TEMP" "mupdf-${{ matrix.platform }}-${{ matrix.arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mupdf-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ github.workspace }}/mupdf-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    steps:
      - name: Download artifact bundles
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Show files
        shell: bash
        run: |
          set -euxo pipefail
          find release-artifacts -type f | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.tar.gz
          generate_release_notes: true
