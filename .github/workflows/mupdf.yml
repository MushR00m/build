name: Build and Release MuPDF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows MSBuild targets
          - os: windows
            arch: x64
            runner: windows-latest
            msbuild_arch: x64
          - os: windows
            arch: x86
            runner: windows-latest
            msbuild_arch: Win32
          - os: windows
            arch: arm64
            runner: windows-latest
            msbuild_arch: ARM64

          # Linux GNU Make targets
          - os: linux
            arch: x64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm

          # macOS GNU Make targets
          - os: macos
            arch: x64
            runner: macos-13
          - os: macos
            arch: arm64
            runner: macos-14

    steps:
      - name: Checkout MuPDF source
        uses: actions/checkout@v4
        with:
          repository: 'ArtifexSoftware/mupdf'
          ref: '1.28.5'
          submodules: recursive

      # -----------------------------------------------------------------
      # Windows: 编译静态库 (libmupdf.lib) 与动态库 (mupdf.dll)
      # -----------------------------------------------------------------
      - name: Setup MSBuild
        if: matrix.os == 'windows'
        uses: microsoft/setup-msbuild@v2

      - name: Build Windows Libraries
        if: matrix.os == 'windows'
        shell: bash
        run: |
          msbuild.exe platform/win32/mupdf.sln \
            -p:Configuration=Release \
            -p:Platform=${{ matrix.msbuild_arch }} \
            -t:libmupdf,libmupdf_dll -m

          mkdir -p package/include package/lib package/bin
          cp -r include/* package/include/

          # 提取输出文件
          find platform/win32 -type f \( -name "*.lib" -o -name "*.dll" \) | while read -r file; do
            if [[ "$file" =~ \.dll$ ]]; then
              cp "$file" package/bin/
            elif [[ "$file" =~ \.lib$ ]]; then
              cp "$file" package/lib/
            fi
          done

      # -----------------------------------------------------------------
      # Linux: 编译静态库 (.a) 与动态库 (.so)
      # -----------------------------------------------------------------
      - name: Install Linux Dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config

      - name: Build Linux Libraries
        if: matrix.os == 'linux'
        run: |
          # 禁用图形组件，仅编译库文件
          make -j$(nproc) build=release HAVE_GLUT=no HAVE_X11=no libs shared

          mkdir -p package/include package/lib
          cp -r include/* package/include/
          
          # 拷贝静态库与共享库
          find build/release -maxdepth 1 -type f \( -name "*.a" -o -name "*.so*" \) -exec cp -d {} package/lib/ \;

      # -----------------------------------------------------------------
      # macOS: 显式关闭 X11/GLUT，解决 glx.h 缺失，生成 .a 与 .dylib
      # -----------------------------------------------------------------
      - name: Build macOS Libraries
        if: matrix.os == 'macos'
        run: |
          # 显式关闭 X11 / GLUT，指定架构仅编译核心库 (libs)
          make -j$(sysctl -n hw.ncpu) \
            build=release \
            HAVE_GLUT=no \
            HAVE_X11=no \
            XCFLAGS="-arch ${{ matrix.arch }}" \
            libs

          mkdir -p package/include package/lib
          cp -r include/* package/include/

          # 拷贝所有静态库 (.a)
          find build/release -maxdepth 1 -name "libmupdf*.a" -exec cp {} package/lib/ \;

          # 打包生成动态库 (.dylib)
          # 注意：MuPDF 1.28.x 第三方依赖通常已预编译进 libmupdf-third.a，故需一并 force_load
          THIRD_LIB=""
          if [ -f "build/release/libmupdf-third.a" ]; then
            THIRD_LIB="-Wl,-force_load,build/release/libmupdf-third.a"
          fi

          clang -dynamiclib \
            -arch ${{ matrix.arch }} \
            -install_name @rpath/libmupdf.dylib \
            -Wl,-force_load,build/release/libmupdf.a \
            $THIRD_LIB \
            -o package/lib/libmupdf.dylib

      # -----------------------------------------------------------------
      # 打包归档
      # -----------------------------------------------------------------
      - name: Package Artifacts
        shell: bash
        run: |
          PKG_NAME="mupdf-1.28.5-${{ matrix.os }}-${{ matrix.arch }}"
          mv package "$PKG_NAME"

          if [ "${{ matrix.os }}" = "windows" ]; then
            7z a "${PKG_NAME}.zip" "${PKG_NAME}"
          else
            zip -ry "${PKG_NAME}.zip" "${PKG_NAME}"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mupdf-1.28.5-${{ matrix.os }}-${{ matrix.arch }}
          path: mupdf-1.28.5-${{ matrix.os }}-${{ matrix.arch }}.zip

  # -----------------------------------------------------------------
  # 发布 GitHub Release
  # -----------------------------------------------------------------
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release_assets/*.zip
          generate_release_notes: true
